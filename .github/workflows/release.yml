name: release

on:
  push:
    tags: ["v*"]
  # Manual dry run: builds without creating a release or uploading.
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  create:
    # Tags only: manual dispatches must not create a "main" release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "occ $TAG" --notes "occ $TAG"
          fi

  build:
    # Tags only for the release object; manual runs still validate builds.
    # (create is skipped on manual dispatch, so don't gate on its success.)
    needs: [create]
    if: ${{ always() && (needs.create.result == 'success' || needs.create.result == 'skipped') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            flags: --os=linux --arch=x64
          - runner: ubuntu-24.04-arm
            flags: --os=linux --arch=arm64
          - runner: macos-latest
            flags: --os=darwin
          - runner: windows-latest
            flags: --os=windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      # Pinned past 1.3.14: bun 1.3.14 cannot extract cross-compile
      # runtimes on some hosts (e.g. bun-linux-aarch64 on Windows).
      # 1.4.2 builds all 14 targets cleanly.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Configure release version
        run: |
          # Uploads only happen for tag pushes with an existing release.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "OPENCODE_RELEASE=1" >> "$GITHUB_ENV"
            echo "OPENCODE_CHANNEL=latest" >> "$GITHUB_ENV"
            echo "OPENCODE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: bun install
      - name: Build ${{ matrix.flags }} targets and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Each job builds a disjoint target shard (no --single), so parallel
        # jobs never build or re-upload each other's archives.
        run: bun packages/occ/script/build.ts --skip-embed-web-ui ${{ matrix.flags }}
